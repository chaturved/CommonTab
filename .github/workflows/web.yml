name: Web app

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the API address is set
        run: test -n "$EXPO_PUBLIC_API_URL" || { echo "Set the repository variable API_URL to the API's address (Settings > Secrets and variables > Actions > Variables)."; exit 1; }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Build the web app
        run: npx expo export --platform web
        working-directory: frontend/apps/app
      - name: Serve the app for addresses that have no file (GitHub Pages sends them to 404.html)
        run: cp dist/index.html dist/404.html
        working-directory: frontend/apps/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/apps/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
