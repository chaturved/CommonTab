name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test calculation and service code
        run: swift test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test API
        run: |
          python -m pip install -e './backend[test]'
          python -m pytest -q backend/tests
      - name: Build iOS app
        run: >-
          xcodebuild -project SplitTip.xcodeproj -scheme SplitTip
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/SplitTipDerivedData"
          CODE_SIGNING_ALLOWED=NO build

  ui-tests:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Run iOS UI tests
        run: >-
          xcodebuild -project SplitTip.xcodeproj -scheme SplitTip
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -parallel-testing-enabled NO
          -derivedDataPath "$RUNNER_TEMP/SplitTipUITestDerivedData"
          -resultBundlePath "$RUNNER_TEMP/SplitTipUITests.xcresult"
          CODE_SIGNING_ALLOWED=NO test
      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SplitTipUITests
          path: ${{ runner.temp }}/SplitTipUITests.xcresult
