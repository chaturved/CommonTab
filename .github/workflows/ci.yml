name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commontab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commontab
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commontab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e './backend[test]'
      - name: Migrations apply to an empty database
        run: alembic upgrade head && alembic downgrade base
        working-directory: backend
      - name: Unit tests
        run: python -m pytest -q backend/tests/unit
      - name: Integration tests
        run: python -m pytest -q backend/tests/integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint --workspace @commontab/app
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Export web bundle (checks Metro and NativeWind config)
        run: npx expo export --platform web
        working-directory: frontend/apps/app
