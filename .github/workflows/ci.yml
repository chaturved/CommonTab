name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commontab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/commontab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e './backend[test]'
      - name: Migrations apply to an empty database
        run: alembic upgrade head && alembic downgrade base
        working-directory: backend
      - name: Test API
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Export web bundle (checks Metro and NativeWind config)
        run: npx expo export --platform web
        working-directory: frontend/apps/app

  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test calculation and service code
        working-directory: legacy/ios
        run: swift test
      - name: Build iOS app
        run: >-
          xcodebuild -project legacy/ios/CommonTab.xcodeproj -scheme CommonTab
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/CommonTabDerivedData"
          CODE_SIGNING_ALLOWED=NO build

  ui-tests:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Run iOS UI tests
        run: >-
          xcodebuild -project legacy/ios/CommonTab.xcodeproj -scheme CommonTab
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -parallel-testing-enabled NO
          -derivedDataPath "$RUNNER_TEMP/CommonTabUITestDerivedData"
          -resultBundlePath "$RUNNER_TEMP/CommonTabUITests.xcresult"
          CODE_SIGNING_ALLOWED=NO test
      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CommonTabUITests
          path: ${{ runner.temp }}/CommonTabUITests.xcresult
