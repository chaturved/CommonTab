[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "splittip-api"
version = "0.2.0"
description = "Shared expenses and bill sessions for SplitTip"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "argon2-cffi>=23,<26",
    "Pillow>=11,<13",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["splittip_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
