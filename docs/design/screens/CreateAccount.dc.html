<div style="margin: 24px 16px 0 16px; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column">

<input id="email" type="email" value="you@example.com" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; font-weight: 600; color: #0E1A1C; padding: 0; outline: none">
</div>
<div style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px">
<label for="password" style="width: 84px; font-size: 14px; color: #5F6B6E">Password</label>

<div style="font-size: 13px; line-height: 1.4; color: #5F6B6E">A short sentence works well, like three random words.</div>
