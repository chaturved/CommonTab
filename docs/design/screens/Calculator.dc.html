<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CommonTab Calculator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #0E1A1C">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0 20px">
<button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; box-shadow: 0 2px 10px rgba(14, 26, 28, 0.08); display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6B58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">Tip &amp; split</h1>
<div style="width: 44px"></div>
</div>

<div style="margin: 20px 16px 0 16px; height: 44px; box-sizing: border-box; padding: 4px; border-radius: 22px; background: #E4E5EA; display: flex; gap: 4px">
<button type="button" style="flex: 1; border: 0; border-radius: 18px; background: #FFFFFF; color: #0E1A1C; font-size: 14px; font-weight: 700; box-shadow: 0 1px 4px rgba(14, 26, 28, 0.1)">By person</button>
<button type="button" style="flex: 1; border: 0; border-radius: 18px; background: transparent; color: #4F5E61; font-size: 14px; font-weight: 600">By item</button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 24px 20px 0 20px">
<label for="bill" style="font-size: 13px; color: #5F6B6E; font-weight: 600">Bill before tip</label>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 4px; width: 100%">
<span style="font-size: 32px; font-weight: 700; color: #5F6B6E">$</span>
<input id="bill" type="text" inputmode="decimal" value="86.40" style="width: 170px; border: 0; background: transparent; font-size: 52px; font-weight: 800; letter-spacing: -0.02em; color: #0E1A1C; padding: 0; outline: none">
</div>
</div>

<div style="padding: 20px 20px 0 20px; font-size: 14px; font-weight: 600; color: #5F6B6E">Tip</div>
<div style="display: flex; gap: 8px; padding: 8px 16px 0 16px">
<button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #34454A; font-size: 15px; font-weight: 600">15%</button>
<button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #34454A; font-size: 15px; font-weight: 600">18%</button>
<button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #0B4350; color: #FFFFFF; font-size: 15px; font-weight: 700">20%</button>
<button type="button" style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #34454A; font-size: 15px; font-weight: 600">25%</button>
</div>

<div style="margin: 16px 16px 0 16px; height: 60px; box-sizing: border-box; border-radius: 20px; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 16px; font-weight: 600">People</span>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" aria-label="Fewer people" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #E6F1EE; display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B6B58" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
</button>
<span style="min-width: 20px; text-align: center; font-size: 20px; font-weight: 700">4</span>
<button type="button" aria-label="More people" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #E6F1EE; display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B6B58" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</div>

<div style="margin: 16px 16px 0 16px; border-radius: 26px; padding: 20px; box-sizing: border-box; background: linear-gradient(160deg, #0B4350 0%, #06222B 100%); color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; font-size: 15px; color: #BFD8D4"><span>Tip (20%)</span><span style="color: #FFFFFF; font-weight: 600">$17.28</span></div>
<div style="display: flex; justify-content: space-between; font-size: 15px; color: #BFD8D4"><span>Total</span><span style="color: #FFFFFF; font-weight: 600">$103.68</span></div>
<div style="height: 1px; background: rgba(255, 255, 255, 0.18)"></div>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8FE5C7">PER PERSON</span>
<span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em">$25.92</span>
</div>
</div>

<button type="button" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 52px; border-radius: 26px; border: 0; background: #0B4350; color: #FFFFFF; font-size: 16px; font-weight: 700">Save as expense</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
