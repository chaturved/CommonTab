<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #0E1A1C">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0 20px; height: 44px">
<div style="width: 52px"></div>
<h1 style="margin: 0; font-size: 18px; font-weight: 700">Invite people</h1>
<button type="button" style="border: 0; background: transparent; padding: 10px 0; color: #0B6B58; font-size: 16px; font-weight: 600">Done</button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 32px 0 32px; text-align: center">
<div style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Add friends to Austin Trip</div>
<div style="font-size: 15px; line-height: 1.4; color: #5F6B6E">Send them this code. They enter it in CommonTab under Join with code.</div>
</div>

<div style="margin: 28px 16px 0 16px; border-radius: 26px; padding: 24px 20px; box-sizing: border-box; background: linear-gradient(160deg, #0B4350 0%, #06222B 100%); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8FE5C7">INVITATION CODE</div>
<div style="font-size: 38px; font-weight: 800; letter-spacing: 0.08em; font-family: ui-monospace, 'SF Mono', Menlo, monospace">K7Q2-9WXM</div>
<div style="font-size: 13px; color: #BFD8D4">Expires in 7 days</div>
</div>

<div style="display: flex; gap: 10px; padding: 16px 16px 0 16px">
<button type="button" style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: #0B4350; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></svg>
Share invite
</button>
<button type="button" style="flex: 1; height: 52px; border-radius: 26px; border: 1.5px solid #0B6B58; background: transparent; color: #0B6B58; font-size: 15px; font-weight: 700">Copy code</button>
</div>

<div style="margin: 24px 16px 0 16px; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column">
<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #ECEEF0">
<span style="font-size: 15px; font-weight: 600">Anyone with the code can join</span>
<span style="font-size: 13px; line-height: 1.4; color: #5F6B6E">Only share it with people you want in this group.</span>
</div>
<button type="button" style="height: 52px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 0; background: transparent; text-align: left"><span style="flex: 1; font-size: 16px; font-weight: 600; color: #0B6B58">Reset code</span></button>
</div>

</div>
</x-dc>
