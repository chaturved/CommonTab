<input type="checkbox" role="switch" style="width: 22px; height: 22px; accent-color: #0B6B58; margin: 0">
</label>
<button type="button" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; text-align: left">
<span style="flex: 1; font-size: 16px; font-weight: 600; color: #0E1A1C">Default currency</span>

</button>
</div>

<div style="padding: 24px 20px 0 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #5F6B6E">YOUR DATA</div>
<div style="margin: 8px 16px 0 16px; border-radius: 20px; background: #FFFFFF; display: flex; flex-direction: column">
<button type="button" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid #ECEEF0; background: transparent; text-align: left">

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6B58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
</button>
<button type="button" style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; border: 0; background: transparent; text-align: left">
<span style="flex: 1; font-size: 16px; font-weight: 600; color: #B3261E">Clear data on this device</span>
</button>
</div>
<div style="padding: 10px 24px 0 24px; font-size: 13px; line-height: 1.4; color: #5F6B6E">This removes the local copy only. Your groups and expenses stay in your account and download again when you sign in. Changes not yet synced would be lost, so CommonTab asks first.</div>

<div style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 13px; color: #5F6B6E">CommonTab</div>
